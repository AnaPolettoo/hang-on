<title>Hang On</title>
<style>
  :root {
    --bg: #FDFBF7;
    --surface: #F6F2EA;
    --ink: #2B1F22;
    --muted: #7A6B6D;
    --accent: #B96C7C;
    --accent-soft: #F0DEE2;
    --border: rgba(43, 31, 34, 0.14);
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1517; --surface: #241C1F; --ink: #F3EAE7;
      --muted: #B6A5A3; --accent: #E4A2AE; --accent-soft: #3A262B;
      --border: rgba(243, 234, 231, 0.14);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    line-height: 1.65; margin: 0; padding: 0 20px;
    min-height: 100vh; display: flex; align-items: center;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .mark {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft);
    border: 1px solid var(--border); position: relative; margin-bottom: 20px;
  }
  .mark::after {
    content: ""; position: absolute; inset: 10px; border: 2px solid var(--accent);
    border-bottom: none; border-radius: 4px 4px 0 0;
  }
  h1 { font-family: var(--font-display); font-size: 32px; font-weight: 400; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: block; padding: 16px 18px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--border); color: var(--ink); text-decoration: none; font-size: 16px;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); }
  a.card span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
</style>

<div class="wrap">
  <div class="mark" aria-hidden="true"></div>
  <h1>Hang On</h1>
  <p>Is it your color?</p>
  <div class="links">
    <a class="card" href="./privacy.html">Privacy policy<span>What Hang On does and doesn't collect</span></a>
    <a class="card" href="./support.html">Support<span>Common questions and how to reach us</span></a>
  </div>
</div>
